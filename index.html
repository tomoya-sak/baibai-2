<style>

  --ground:#E7EBF1;
  --panel:#F6F8FB;

  --cell:#DCE2EB;

html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--fb);padding-inline:16px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:420px;margin:0 auto;padding-block:20px 28px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--fd);font-weight:400;font-size:clamp(20px,6.4vw,28px);line-height:1.05;margin:0;letter-spacing:.01em;white-space:nowrap}
h1 small{display:block;font-family:var(--fn);font-weight:600;font-size:12px;letter-spacing:.14em;color:var(--muted);margin-bottom:4px}

.stat{background:var(--panel);border-radius:10px;padding:6px 10px;min-width:56px;text-align:right}
.stat span{display:block;font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:700}

.queue{position:relative;height:78px}
/* 次の次のタイル: 点線の箱に入れて、小さく薄く */
.nextbox{border:1.5px dashed var(--muted);border-radius:10px;padding:4px 8px;display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.nextbox .mini{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-family:var(--fn);font-weight:800;font-size:12px;opacity:.6;box-shadow:none}
.nextbox .mini.in{animation:minin .25s ease-out}
@keyframes minin{from{transform:scale(.4);opacity:0}}
.fly{position:fixed;z-index:50;border-radius:10px;display:grid;place-items:center;font-family:var(--fn);font-weight:800;pointer-events:none;transition:left .24s cubic-bezier(.3,.7,.3,1),top .24s cubic-bezier(.3,.7,.3,1),width .24s ease,height .24s ease,font-size .24s ease,opacity .24s ease}
.boardbox{position:relative}
.board{position:relative;aspect-ratio:1/1;width:100%;max-width:100%;background:var(--board);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;touch-action:manipulation;cursor:pointer;user-select:none}
.board:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.cell,.tile,.colhl,.ghost{position:absolute;
  width:calc((100% - 2*var(--p) - 4*var(--g))/5);
  left:calc(var(--p) + var(--c) * ((100% - 2*var(--p) - 4*var(--g))/5 + var(--g)));
}
.cell,.tile{height:calc((100% - 2*var(--p) - 4*var(--g))/5);
  top:calc(var(--p) + var(--r) * ((100% - 2*var(--p) - 4*var(--g))/5 + var(--g)));border-radius:10px}
.cell{background:var(--cell)}
.colhl{top:0;bottom:0;width:calc((100% - 2*var(--p) - 4*var(--g))/5 + var(--g));margin-left:calc(var(--g)/-2);background:var(--hl);transition:left .12s ease;pointer-events:none}
.tile{display:grid;place-items:center;font-family:var(--fn);font-weight:800;transition:top .16s ease-in,left .14s ease,opacity .14s ease;box-shadow:0 -3px 0 rgba(0,0,0,.14) inset,0 2px 0 rgba(255,255,255,.28) inset;z-index:2}
.tile.gone{opacity:0;z-index:1}
.tile.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
.qtile{position:absolute;top:2px;height:58px;width:58px;border-radius:12px;display:grid;place-items:center;font-family:var(--fn);font-weight:800;transition:left .12s ease,opacity .1s;box-shadow:0 -3px 0 rgba(0,0,0,.14) inset,0 8px 16px rgba(27,34,48,.22)}
/* 今から落とすタイル: 下向きの矢印で落ちる列を指す */
.qtile::after{content:"";position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);border:7px solid transparent;border-top:8px solid var(--accent);border-bottom:0}
.combo{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--fd);font-size:34px;color:#fff;-webkit-text-stroke:1.5px var(--accent);paint-order:stroke;text-shadow:0 3px 0 var(--accent);pointer-events:none;z-index:5;animation:combo .8s ease-out forwards}
@keyframes combo{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.over{position:absolute;inset:0;border-radius:16px;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:10;text-align:center;padding:16px;animation:overin .3s ease-out}
@keyframes overin{from{opacity:0}}
.over h2{font-family:var(--fd);font-weight:400;font-size:clamp(22px,7vw,28px);margin:0}
.over .newbest{font-size:11px;font-weight:700;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:999px;padding:3px 10px}
.over .maxrow{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em}
.over .maxrow .mt{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--fn);font-weight:800;font-size:15px;box-shadow:0 -3px 0 rgba(0,0,0,.14) inset}
.over .scores{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(100%,280px)}
.over .sc{background:var(--panel);border-radius:10px;padding:8px 10px}
.over .sc span{display:block;font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.over .sc b{font-family:var(--fn);font-weight:800;font-size:clamp(18px,6vw,24px);font-variant-numeric:tabular-nums}
.over .acts{display:flex;flex-direction:column;gap:8px;width:min(100%,280px)}
.over .acts a,.over .acts button{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-family:var(--fb);font-weight:700;font-size:14px;border-radius:10px;padding:11px 16px}
.over .xshare{background:#0F1419;color:#fff}
.over .xshare svg{width:15px;height:15px}
.over .xshare:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
button{font-family:var(--fb);font-weight:700;font-size:14px;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:#fff;cursor:pointer}
button.ghostbtn{background:var(--panel);color:var(--ink)}
.btns{display:flex;gap:8px}
#sound{display:flex;align-items:center;gap:6px}
#sound svg{width:18px;height:18px}
#sound[aria-pressed="false"]{color:var(--muted)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.rules{font-size:13px;line-height:1.7;color:var(--muted);margin:0}
.rules b{color:var(--ink)}
/* tile glazes */
.e1{background:#FFF4CC;color:#4A3A10}.e2{background:#FFE07A;color:#4A3500}.e3{background:#FFA94D;color:#4A2300}
.e4{background:#FF6B3D;color:#fff}.e5{background:#E23B4E;color:#fff}.e6{background:#C22E7C;color:#fff}
.e7{background:#8B3CC8;color:#fff}.e8{background:#4B57D8;color:#fff}.e9{background:#2491E3;color:#fff}
.e10{background:#15B3A6;color:#fff}.e11{background:#36B94F;color:#fff}.e12{background:#9FD235;color:#243300}
.e13{background:#F5C400;color:#3A2E00}.e14{background:#1C2230;color:#F4C94A;box-shadow:0 0 0 2px #F4C94A inset}
.e15,.e16{background:#0B0E14;color:#FF8FB1;box-shadow:0 0 0 2px #FF8FB1 inset}
@media (prefers-reduced-motion: reduce){.tile,.qtile,.colhl,.fly{transition:none}.tile.pop,.combo,.shake,.nextbox .mini.in{animation:none}}
</style>

<body>
<div class="wrap">
  <header>
    <h1><small>5×5 MERGE PUZZLE</small>倍倍タイル！</h1>
    <div class="stats">
      <div class="nextbox" aria-label="その次のタイル">Next<div class="mini" id="next2"></div></div>
      <div class="stat"><span>スコア</span><b id="score">0</b></div>
      <div class="stat"><span>ベスト</span><b id="best">0</b></div>
    </div>
  </header>

  <div class="queue" id="queue" aria-label="今から落とすタイル"></div>

  <div class="boardbox">
    <div class="board" id="board" tabindex="0" role="application" aria-label="5×5の盤面。列をタップしてタイルを落とす。キーボードは1〜5か矢印キーとスペース"></div>
  </div>

  <div class="bar">
    <div class="rules">最大タイル <b id="maxtile">2</b></div>
    <div class="btns">
      <button class="ghostbtn" id="sound" aria-pressed="true"></button>
      <button class="ghostbtn" id="restart">はじめから</button>
    </div>
  </div>

  <p class="rules">列をタップ（クリック）するとタイルが落ちます。同じ数字が<b>上下左右でくっつく</b>と自動で合体。<b>2枚で2倍、3枚で4倍、4枚で8倍</b>。合体でさらにくっつけば連鎖ボーナス。降ってくる数字は、盤面にある一番大きい数字の2段階下まで。6段階以上小さい数字は出にくくなります。どの列にも置けなくなったら終わりです。</p>
  <p class="rules" style="font-size:11px">このサイトでは、利用状況の把握のためにGoogleアナリティクスを使用しています。収集されるデータは匿名で、個人を特定するものではありません。</p>
</div>

<script>
(function(){
const N=5;
const $=id=>document.getElementById(id);
const boardEl=$('board'), queueEl=$('queue');
let S, busy=false, sel=2, uid=1;
const els=new Map();
const sleep=ms=>new Promise(r=>setTimeout(r,matchMedia('(prefers-reduced-motion: reduce)').matches?Math.min(ms,30):ms));
const exp=v=>Math.round(Math.log2(v));
const fmt=v=>v>=1e6?Math.round(v/1e6)+'M':v>=1e5?Math.round(v/1e3)+'K':String(v);
const fsize=v=>{const n=fmt(v).length;return n<=2?'clamp(20px,7vw,30px)':n===3?'clamp(17px,6vw,25px)':n===4?'clamp(14px,4.8vw,20px)':'clamp(12px,4vw,17px)';};
const cls=v=>'e'+Math.min(exp(v),15);

// v8でスコア計算を変更したため、ベストスコアは新しいキーで保存（旧キー mdrop-best は削除）
let best=0; try{localStorage.removeItem('mdrop-best');best=+localStorage.getItem('bbtile-best-v2')||0}catch(e){}

// アクセス解析（公開版のみ gtag が読み込まれる。無ければ何もしない）
function track(name,params){try{if(typeof window.gtag==='function')window.gtag('event',name,params||{})}catch(e){}}
function bumpMax(v){if(v>S.maxTile){S.maxTile=v;if(v>=32)track('tile_reached',{tile:v})}}
/* ---------- サウンド（Web Audioで合成。音声ファイルなし） ---------- */
let actx=null,master=null,soundOn=true;
try{soundOn=localStorage.getItem('bbtile-sound')!=='0'}catch(e){}
function audio(){
  if(!soundOn)return null;
  try{
    if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C();master=actx.createGain();master.gain.value=.55;master.connect(actx.destination)}
    if(actx.state==='suspended')actx.resume();
  }catch(e){return null}
  return actx;
}
// 短いノイズ（type: bandpass / lowpass）
let noiseBuf=null;
function noise(t,dur,freq,vol,type,q){
  if(!noiseBuf){noiseBuf=actx.createBuffer(1,Math.floor(actx.sampleRate*.1),actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const n=actx.createBufferSource(),fl=actx.createBiquadFilter(),g=actx.createGain();
  n.buffer=noiseBuf;fl.type=type||'bandpass';fl.frequency.value=freq;fl.Q.value=q||1;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  n.connect(fl);fl.connect(g);g.connect(master);n.start(t);n.stop(t+dur+.01);
}
// 「チュ」: 高いところから一気に下がるサイン波（水っぽい、小さく吸い付く音）
function chu(f,t,dur,vol){
  const o=actx.createOscillator(),g=actx.createGain();o.type='sine';
  o.frequency.setValueAtTime(f*2.4,t);o.frequency.exponentialRampToValueAtTime(f*.85,t+dur*.7);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
}
// 「プ」: ごく短い、こもった破裂音
function pu(t,vol){
  noise(t,.012,900,vol,'lowpass',.7);
  const o=actx.createOscillator(),g=actx.createGain();o.type='sine';
  o.frequency.setValueAtTime(260,t);o.frequency.exponentialRampToValueAtTime(120,t+.02);
  g.gain.setValueAtTime(vol*.5,t);g.gain.exponentialRampToValueAtTime(.0001,t+.03);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+.05);
}
// 合体音「プチュ」。連鎖するほど音階が上がる（ペンタトニック）
function playMerge(chain,value){
  const a=audio();if(!a)return;
  const t=a.currentTime+.005;
  const deg=Math.min(11,(chain-1)*2+Math.min(2,Math.floor((exp(value)-1)/4)));
  const sc=[0,2,4,7,9],st=12*Math.floor(deg/5)+sc[deg%5];
  const f=440*2**((st+3)/12); // C5 から
  pu(t,.5);                              // プ
  chu(f,t+.018,.07,.28);                 // チュ
  noise(t+.018,.03,3200+deg*150,.12,'bandpass',3); // 水っぽさ
  if(chain>=2)chu(f*1.5,t+.07,.05,.14);
  if(value>=256)chu(f*2,t+.11,.05,.11);
}
const ICON_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const ICON_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6M22 9l-6 6"/></svg>';
function paintSound(){const b=$('sound');b.setAttribute('aria-pressed',soundOn);b.innerHTML=(soundOn?ICON_ON:ICON_OFF)+(soundOn?'音 ON':'音 OFF')}

function boardMax(){let m=0;for(const row of S.grid)for(const t of row)if(t&&t.v>m)m=t.v;return m}
function randVal(){
  // 上限は場の最大値の2段階下。場の最大値が8以下なら2と4のみ
  // 場の最大値より6段階以上小さい数字は出にくくする（重み1/4）。それ以外は等確率
  const m=boardMax();
  const hi=m<=8?2:exp(m)-2;
  const low=exp(m)-6;
  const w=[];let tot=0;
  for(let e=1;e<=hi;e++){const x=e<=low?0.25:1;w.push(x);tot+=x}
  let r=Math.random()*tot;
  for(let i=0;i<w.length;i++){r-=w[i];if(r<0)return 2**(i+1)}
  return 2**hi;
}
function fresh(){
  S={grid:Array.from({length:N},()=>Array(N).fill(null)),score:0,maxTile:2,next:0,next2:0,over:false,moves:0,startedAt:Date.now(),bestBefore:best};
  // 初期タイル5枚を下から2段までにランダム配置。値は2/4/8で最大値は必ず8（隣り合う同じ数字は作らない）
  let placed=0;
  while(placed<5){
    const c=Math.floor(Math.random()*N);
    const r=S.grid[N-1][c]?N-2:N-1;
    if(S.grid[r][c])continue;
    const opts=[2,4,8].filter(v=>![[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>{const t=S.grid[r+a]?.[c+b];return t&&t.v===v}));
    if(placed===0&&!opts.includes(8))continue;
    const v=placed===0?8:opts[Math.floor(Math.random()*opts.length)]; // 1枚目は必ず8（初期の最大値を8にする）
    S.grid[r][c]={id:uid++,v};S.maxTile=Math.max(S.maxTile,v);placed++;
  }
  S.next=randVal();S.next2=randVal();
}

/* ---------- rendering ---------- */
function build(){
  boardEl.innerHTML='';els.clear();
  const hl=document.createElement('div');hl.className='colhl';hl.id='colhl';boardEl.appendChild(hl);
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=document.createElement('div');d.className='cell';d.style.setProperty('--r',r);d.style.setProperty('--c',c);boardEl.appendChild(d)}
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=S.grid[r][c];if(t)makeEl(t,r,c)}
  paintQueue();setSel(sel);paintHud();if(S.over)showOver();
}
function makeEl(t,r,c){
  const d=document.createElement('div');d.className='tile '+cls(t.v);d.textContent=fmt(t.v);d.style.fontSize=fsize(t.v);
  d.style.setProperty('--r',r);d.style.setProperty('--c',c);boardEl.appendChild(d);els.set(t.id,d);return d;
}
function place(id,r,c){const d=els.get(id);if(d){d.style.setProperty('--r',r);d.style.setProperty('--c',c)}}
function setVal(t){const d=els.get(t.id);if(!d)return;d.className='tile '+cls(t.v);d.textContent=fmt(t.v);d.style.fontSize=fsize(t.v);void d.offsetWidth;d.classList.add('pop')}
function paintQueue(){
  queueEl.innerHTML='';
  const q=document.createElement('div');q.className='qtile '+cls(S.next);q.textContent=fmt(S.next);q.style.fontSize=fsize(S.next);q.id='qt';
  queueEl.appendChild(q);posQueue();
  const m=$('next2');m.className='mini '+cls(S.next2);m.textContent=fmt(S.next2);
  return q;
}
// 落としたあと、Nextのタイルが「今から落とすタイル」の位置へ移動する演出
function flyNext(from){
  const q=$('qt'),m=$('next2');if(!q||!from)return;
  m.classList.remove('in');void m.offsetWidth;m.classList.add('in');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const to=q.getBoundingClientRect();
  const f=document.createElement('div');f.className='fly '+cls(S.next);f.textContent=fmt(S.next);
  Object.assign(f.style,{left:from.left+'px',top:from.top+'px',width:from.width+'px',height:from.height+'px',fontSize:'12px',opacity:.6});
  document.body.appendChild(f);q.style.opacity=0;void f.offsetWidth;
  Object.assign(f.style,{left:to.left+'px',top:to.top+'px',width:to.width+'px',height:to.height+'px',fontSize:getComputedStyle(q).fontSize,opacity:1});
  setTimeout(()=>{f.remove();const q2=$('qt');if(q2)q2.style.opacity=''},250);
}
function posQueue(){
  const q=$('qt');if(!q)return;
  const W=boardEl.clientWidth,p=8,g=7,cw=(W-2*p-4*g)/5;
  const sz=Math.min(62,cw*.88);
  q.style.width=q.style.height=sz+'px';
  q.style.left=(p+sel*(cw+g)+cw/2-sz/2)+'px';
}
function paintHud(){
  $('score').textContent=S.score.toLocaleString();
  if(S.score>best){best=S.score;try{localStorage.setItem('bbtile-best-v2',best)}catch(e){}}
  $('best').textContent=best.toLocaleString();
  $('maxtile').textContent=S.maxTile.toLocaleString();
}
function setSel(c){sel=c;const h=$('colhl');if(h)h.style.setProperty('--c',c);posQueue()}
function combo(n){if(n<2)return;const d=document.createElement('div');d.className='combo';d.textContent=n+'連鎖!';boardEl.appendChild(d);setTimeout(()=>d.remove(),850)}

/* ---------- logic ---------- */
function findPos(id){for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(S.grid[r][c]&&S.grid[r][c].id===id)return[r,c];return null}
function group(r,c){
  const v=S.grid[r][c].v,seen=new Set([r*N+c]),st=[[r,c]],out=[];
  while(st.length){const[a,b]=st.pop();out.push([a,b]);
    for(const[da,db]of[[1,0],[-1,0],[0,1],[0,-1]]){const x=a+da,y=b+db;
      if(x<0||y<0||x>=N||y>=N||seen.has(x*N+y))continue;const t=S.grid[x][y];
      if(t&&t.v===v){seen.add(x*N+y);st.push([x,y])}}}
  return out;
}
async function gravity(){
  const moved=[];
  for(let c=0;c<N;c++){let w=N-1;for(let r=N-1;r>=0;r--){const t=S.grid[r][c];if(!t)continue;
    if(r!==w){S.grid[w][c]=t;S.grid[r][c]=null;place(t.id,w,c);moved.push(t.id)}w--}}
  if(moved.length)await sleep(170);
  return moved;
}
async function resolve(active){
  let chain=0;
  while(active.length){
    const used=new Set(),merges=[];
    for(const id of active){const p=findPos(id);if(!p||used.has(p[0]*N+p[1]))continue;
      const gp=group(p[0],p[1]);gp.forEach(([a,b])=>used.add(a*N+b));
      if(gp.length>=2)merges.push({t:p,g:gp});}
    if(!merges.length)break;
    chain++;
    const targets=[];
    for(const m of merges){
      const[tr,tc]=m.t,tt=S.grid[tr][tc];
      for(const[a,b]of m.g){if(a===tr&&b===tc)continue;const o=S.grid[a][b];const d=els.get(o.id);
        place(o.id,tr,tc);if(d)d.classList.add('gone');S.grid[a][b]=null;
        setTimeout(()=>{d&&d.remove();els.delete(o.id)},170);}
      tt.v=tt.v*2**(m.g.length-1);targets.push(tt);
    }
    await sleep(150);
    let gain=0;for(const t of targets){setVal(t);gain+=t.v;bumpMax(t.v)}
    // 加点 = できた数字 × (1 + 0.5 × (連鎖数 − 1))
    S.score+=Math.round(gain*(1+0.5*(chain-1)));combo(chain);playMerge(chain,Math.max(...targets.map(t=>t.v)));paintHud();
    await sleep(120);
    const moved=await gravity();
    active=[...targets.map(t=>t.id),...moved];
  }
}
function canDrop(c){const top=S.grid[0][c];return !top||top.v===S.next}
async function drop(c){
  if(busy||S.over)return;
  if(!canDrop(c)){boardEl.classList.remove('shake');void boardEl.offsetWidth;boardEl.classList.add('shake');return}
  audio(); // 最初のタップで音を使えるようにする（ブラウザの決まり）
  busy=true;setSel(c);S.moves=(S.moves||0)+1;
  const from=$('next2').getBoundingClientRect();
  const v=S.next;S.next=S.next2;S.next2=randVal();paintQueue();flyNext(from);
  const t={id:uid++,v};
  let r=-1;for(let i=N-1;i>=0;i--)if(!S.grid[i][c]){r=i;break}
  const d=makeEl(t,-1,c);void d.offsetWidth;
  if(r>=0){
    d.style.transitionDuration=(0.08+0.035*(r+1))+'s';place(t.id,r,c);S.grid[r][c]=t;
    await sleep(90+35*(r+1));d.style.transitionDuration='';
    await resolve([t.id]);
  }else{
    // column full but top matches: land on top tile and merge with its group
    const top=S.grid[0][c];place(t.id,0,c);d.classList.add('gone');await sleep(140);d.remove();els.delete(t.id);
    const gp=group(0,c);
    for(const[a,b]of gp){if(a===0&&b===c)continue;const o=S.grid[a][b];const od=els.get(o.id);place(o.id,0,c);od&&od.classList.add('gone');S.grid[a][b]=null;setTimeout(()=>{od&&od.remove();els.delete(o.id)},170)}
    top.v=top.v*2**gp.length;await sleep(150);setVal(top);bumpMax(top.v);S.score+=top.v;playMerge(1,top.v);paintHud();
    await sleep(120);const moved=await gravity();await resolve([top.id,...moved]);
  }
  paintHud();
  if(![0,1,2,3,4].some(canDrop)){S.over=true;S.newBest=S.score>0&&S.score>(S.bestBefore??best);showOver();
    track('game_over',{score:S.score,max_tile:S.maxTile,moves:S.moves||0,play_seconds:Math.round((Date.now()-(S.startedAt||Date.now()))/1000)})}
  busy=false;
}
// 公開ページのURL（Claudeの試作版ではURLを付けない）
function gameUrl(){try{return /github\.io$/.test(location.hostname)?location.origin+location.pathname:''}catch(e){return ''}}
// Xに投稿する文言
function shareText(){
  const mt=S.maxTile.toLocaleString(),sc=S.score.toLocaleString();
  return S.newBest
    ? `倍倍タイル！で自己ベスト更新！\n「${mt}」まで倍々にして ${sc}点\n\nあなたはどこまで倍々にできる？`
    : `倍倍タイル！で「${mt}」まで倍々にできた！\nスコア ${sc}点\n\nあなたはどこまで倍々にできる？`;
}
function shareHref(){
  const e=encodeURIComponent,u=gameUrl();
  return 'https://x.com/intent/post?text='+e(shareText())+(u?'&url='+e(u):'')+'&hashtags='+e('倍倍タイル');
}
const X_ICON='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.9 2H22l-7.2 8.2L23.3 22h-6.6l-5.2-6.8L5.6 22H2.4l7.7-8.8L2 2h6.8l4.7 6.2zm-1.2 18h1.8L7.4 3.9H5.5z"/></svg>';
function showOver(){
  if(document.querySelector('.over'))return;
  const o=document.createElement('div');o.className='over';o.setAttribute('role','dialog');o.setAttribute('aria-label','ゲームオーバー');
  o.innerHTML='<h2>ゲームオーバー</h2>'
    +(S.newBest?'<div class="newbest">自己ベスト更新！</div>':'')
    +'<div class="maxrow">最大タイル<div class="mt '+cls(S.maxTile)+'">'+fmt(S.maxTile)+'</div></div>'
    +'<div class="scores"><div class="sc"><span>今回のスコア</span><b>'+S.score.toLocaleString()+'</b></div>'
    +'<div class="sc"><span>ベストスコア</span><b>'+best.toLocaleString()+'</b></div></div>'
    +'<div class="acts"><a class="xshare" target="_blank" rel="noopener" href="'+shareHref().replace(/"/g,'&quot;')+'">'+X_ICON+'Xでシェア</a></div>';
  const x=o.querySelector('.xshare');x.addEventListener('click',()=>track('share',{method:'x',score:S.score,max_tile:S.maxTile}));
  const b=document.createElement('button');b.textContent='もう一度あそぶ';b.onclick=restart;o.querySelector('.acts').appendChild(b);
  document.querySelector('.boardbox').appendChild(o);b.focus();
}
function restart(){const was=S&&!S.over&&S.moves>0;document.querySelector('.over')?.remove();busy=false;
  if(was)track('game_quit',{score:S.score,max_tile:S.maxTile,moves:S.moves});
  fresh();build();boardEl.focus();track('game_start',{start_type:'restart'})}

/* ---------- input ---------- */
function colAt(x){const r=boardEl.getBoundingClientRect();return Math.max(0,Math.min(N-1,Math.floor((x-r.left)/r.width*N)))}
boardEl.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&!busy)setSel(colAt(e.clientX))});
boardEl.addEventListener('click',e=>drop(colAt(e.clientX)));
boardEl.addEventListener('keydown',e=>{
  if(e.key>='1'&&e.key<='5'){drop(+e.key-1);e.preventDefault()}
  else if(e.key==='ArrowLeft'){if(!busy)setSel(Math.max(0,sel-1));e.preventDefault()}
  else if(e.key==='ArrowRight'){if(!busy)setSel(Math.min(N-1,sel+1));e.preventDefault()}
  else if(e.key===' '||e.key==='Enter'||e.key==='ArrowDown'){drop(sel);e.preventDefault()}
});
$('restart').onclick=restart;
$('sound').onclick=()=>{soundOn=!soundOn;try{localStorage.setItem('bbtile-sound',soundOn?'1':'0')}catch(e){}paintSound();if(soundOn){audio();playMerge(1,4)}};
paintSound();
addEventListener('resize',posQueue);

/* ---------- boot (keeps a game in progress across page updates) ---------- */
function start(data){
  if(data&&data.S&&data.S.grid){S=data.S;uid=data.uid||1000;}else{fresh();track('game_start',{start_type:'first'})}
  build();
  window.claude?.hot?.snapshot?.(()=>({S,uid}));
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
